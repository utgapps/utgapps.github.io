<style>

  }
  :root[data-theme="dark"] {
    --page: #12161c; --panel: #1a2029; --ink: #e8edf3; --muted: #9aa6b5; --line: #2c3542;
    --accent: #5b9bf0; --accent-ink: #0d1117; --chip: #232b36; --scene: #161b22; --zone: #3cc488;

  .dots { display: flex; gap: 4px; margin: 0 0 12px; }

  header a { color: var(--accent); }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// The build comes from drive-base-tied.json, which vex-build-center-app/tools/export-drive-base.mjs
// writes from the library's Tied Pods design after the library verifier has passed it at every
// ratio: every axle held in two places, nothing loose, nothing clipping, the wheels turning
// together at the speed the gears say. Millimetres. X is forward, Y up, Z to the robot's right.
const PITCH = 12.7;
const WHEEL_RADIUS = 31.83;
const MOTOR_RPM = 120;                       // an IQ Smart Motor at full speed
const WHEEL_SPEED = (MOTOR_RPM / 60) * 2 * Math.PI * WHEEL_RADIUS; // mm per second at 100%, if the wheel turned at the motor's speed

const data = await fetch("drive-base-tied.json").then((response) => response.json());
const { info } = data;
const holes = (list) => list.length > 1 ? `${list.slice(0, -1).join(", ")} and ${list[list.length - 1]}` : String(list[0]);

// The three gear sets. The same axles take every set; only the gears change.
const RATIO_NAMES = { 1: "Normal", 0.5: "Strong", 2: "Fast" };
const RATIO_NOTES = {
  1: "The wheels turn at the motor's speed. Start here.",
  0.5: "Half the speed, twice the push. For pushing, climbing, or a heavy robot.",
  2: "Twice the speed, half the push. Only for a light robot: a heavy one stalls the motors.",
};
let ratioIndex = 0;
const ratio = () => info.ratios[ratioIndex];
const ratioLabel = ({ motorTeeth, wheelTeeth, turns }) => `${RATIO_NAMES[turns] ?? ""} ${motorTeeth}T to ${wheelTeeth}T`.trim();

const PART_NAMES = {
  "robot-brain": "Robot Brain", "beam-2x20": "2x20 Beam", "beam-2x8": "2x8 Beam", "corner-2x2": "2x2 Corner Connector",
  "pin-connector-1x1": "1x1 Connector Pin", "standoff-15x": "1.5x Standoff", "standoff-3x": "3x Standoff",
  "gear-24t": "24T Gear", "gear-36t": "36T Gear", "gear-48t": "48T Gear", "shaft-6x": "6x Axle",
  "rubber-collar": "Rubber Shaft Collar", "smart-motor": "Smart Motor", "wheel-omni-200": "200 mm Omni Wheel",
};
const COLORS = {
  "robot-brain": "#30343b", "beam-2x20": "#6f86a3", "beam-2x8": "#8a9bb3", "corner-2x2": "#c8cfd8",
  "pin-connector-1x1": "#d8b04a", "standoff-15x": "#4f79b8", "standoff-3x": "#3f9a8c", "shaft-6x": "#a7b0bc",
  "rubber-collar": "#2b2b2b", "smart-motor": "#3a3f47", "wheel-omni-200": "#3d4450",
};
const GEAR_COLORS = { motor: "#d04a3a", wheel: "#e8892b" }; // the motor's size and the wheels' size
const STEP = Object.fromEntries(data.steps.map((name, index) => [name, index]));
const pinHole = ({ hole, row }) => `${hole} (${row} row)`;
// A corner's two pins: "hole 2, both rows" when they share a hole, else each hole and row.
const pinPair = (pins, end) => {
  const pair = pins.filter((pin) => end === "back" ? pin.hole < 10 : pin.hole > 10);
  return pair.length === 2 && pair[0].hole === pair[1].hole ? `hole ${pair[0].hole}, both rows` : `holes ${pair.map(pinHole).join(" and ")}`;
};
const axleAt = (hole) => info.axleFill.find((axle) => axle.hole === hole);
const idlers = info.gears.filter((hole) => hole !== info.motor && !info.wheels.includes(hole));
const gearKey = (kind) => `<span class="gear-key" style="background:${GEAR_COLORS[kind]}"></span>`;
const ratioPicker = () => `<div class="ratio-picker"><h3>Gear ratio</h3><div class="presets">${info.ratios.map((choice, index) =>
  `<button class="chip-button" data-ratio="${index}" aria-pressed="${index === ratioIndex}">${ratioLabel(choice)}</button>`).join("")}</div>
  <p class="note" style="margin-top:6px">${RATIO_NOTES[ratio().turns] ?? ""}</p></div>`;

// ---- Steps ------------------------------------------------------------------------------
// Rail holes are counted 1 to 20 from the BACK end. Cross beam holes are counted 1 to 20 from
// the robot's LEFT end. Every beam stands on its long edge, so it has a top and a bottom row.
// A step's text is a function: the gear step quotes the ratio picked.
const steps = [
  {
    title: "The Brain and its beams",
    view: "corner",
    text: () => `<p>Stand a <b>2x8 beam</b> on its long edge against the left side of the <b>Robot Brain</b>, its <b>top row</b> lined up with the Brain's row of side holes. Pin it with <b>1x1 connector pins</b> in the 2x8's <b>holes ${holes(info.brainPins)}</b>, top row. Do the same on the right side.</p>
      <p>Push a <b>1.5x standoff</b> into each 2x8's <b>bottom row</b> at <b>holes ${holes(info.standoffs.map((hole) => hole - info.brainRail[0] + 1))}</b>, pointing out to the side. That is 2 standoffs on each side.</p>
      <p class="note">Four pins a side, not two: the Brain is the heaviest part, and in a drop it is what tears loose first. The beams hang below the Brain, so the Smart Ports on top stay clear for cables.</p>`,
  },
  {
    title: "The frame",
    view: "corner",
    text: () => `<p>Two <b>2x20 beams</b> are the <b>inner rails</b>. From now on, count a rail's holes from the <b>back</b>: hole 1 at the back, hole 20 at the front.</p>
      <ol>
        <li>Press an inner rail onto each side's standoffs, at the rail's <b>holes ${holes(info.standoffs)}</b>, bottom row. The Brain ends up toward the front, with ${info.brainRail[0] - 1} holes of rail behind it and ${20 - info.brainRail[1]} in front. The motors go in the space behind it.</li>
        <li>On each rail's <b>inside face</b>, put a <b>2x2 corner connector</b> at both ends, its two built-in pins pointing past the rail's end. Pin it to the rail with two <b>1x1 connector pins</b>: ${pinPair(info.innerCornerPins, "back")} at the back, ${pinPair(info.innerCornerPins, "front")} at the front.</li>
        <li>Two more 2x20 beams are the <b>cross beams</b>. Count their holes from the robot's <b>left</b>. Press one across the back onto the corners' pins, so they go into its <b>holes ${holes(info.innerColumns)}</b>, both rows. Do the same across the front.</li>
      </ol>
      <p class="note">The inner rails sit 5 holes in from each end of the cross beams. That leaves room outside them for the gears and wheels: the <b>pod</b>.</p>`,
  },
  {
    title: "The motors",
    view: "rear",
    text: () => `<p>The motors go <b>inside</b> the robot, behind the Brain.</p>
      <ol>
        <li>Stand a <b>Smart Motor</b> against the inside face of the left inner rail at <b>hole ${info.motor}</b>, body pointing <b>up</b>, its square socket facing the rail's <b>bottom row</b>.</li>
        <li>From outside the rail, push a <b>1x1 connector pin</b> through hole ${pinHole(info.motorPin)} into the motor.</li>
        <li>From outside, push a <b>6x axle</b> through hole ${info.motor}, bottom row, into the motor's socket.</li>
      </ol>
      <p>Do the same on the right. The motor is held twice: by the pin, and by its own axle through the rail. Its axle carries a gear but <b>no wheel</b>, so a hard landing on a wheel never reaches the motor.</p>`,
  },
  {
    title: "The gear train",
    view: "side",
    text: () => {
      const { motorTeeth, wheelTeeth } = ratio();
      return `<p>Each side's gears go on the <b>outside</b> of its inner rail, in the <b>bottom row</b>. Pick the gears first: every set fits the same axles, so you can swap them later without moving anything else.</p>
      ${ratioPicker()}
      <ol>
        <li>At <b>holes ${holes(info.gears.filter((hole) => hole !== info.motor))}</b>, push a <b>6x axle</b> through the rail from the inside, with a <b>rubber shaft collar</b> on its inside end.</li>
        <li>${gearKey("motor")}On the motor's axle at hole ${info.motor} and the axle at hole ${holes(info.motorGears.filter((hole) => hole !== info.motor))}, slide a <b>${motorTeeth}T gear</b> on tight against the rail.</li>
        <li>${gearKey("wheel")}On the axles at <b>holes ${holes(info.wheelGears)}</b>, slide a <b>${wheelTeeth}T gear</b> on tight against the rail.</li>
        <li>On the wheel axles at <b>holes ${holes(info.wheels)}</b>, put ${axleAt(info.wheels[0]).pod} collar after the gear. Fill the axles at holes ${holes([info.motor, ...idlers].sort((first, second) => first - second))} with <b>${axleAt(info.motor).pod} collars</b> each: they are spacers that stop those axles sliding.</li>
      </ol>
      <p>Gears 3 holes apart mesh when their teeth add up to 72: 36 and 36, 24 and 48, or 48 and 24. Every gear meshes only with gears of the other color, so the whole side turns at one ratio.</p>`;
    },
  },
  {
    title: "The wheels",
    view: "corner",
    text: () => `<p>Slide a <b>200 mm omni wheel</b> onto the axles at <b>holes ${holes(info.wheels)}</b>, against the collar.</p>
      <p>Neither wheel is on the motor's axle. The motor's gear at hole ${info.motor} turns the rear wheel's gear at hole ${info.wheels[0]} directly, and the gear at hole ${idlers[0]}, which passes the turn along to the front wheel at hole ${info.wheels[1]}.</p>`,
  },
  {
    title: "Ties, side walls and cables",
    view: "corner",
    text: () => `<p>The last two 2x20 beams are the <b>outer rails</b>, the robot's side walls. Tie each pod shut first, so the two rails can never spread apart.</p>
      <ol>
        <li>Push a <b>3x standoff</b> into the outside face of each inner rail at <b>holes ${holes(info.ties)}</b>, <b>both rows</b>. That is 4 standoffs a side, one at each corner of the pod.</li>
        <li>Press an outer rail onto the axle ends sticking out at <b>holes ${holes(info.gears)}</b>, bottom row, and onto the standoffs' ends at holes ${holes(info.ties)}.</li>
        <li>On its <b>outside face</b>, put a corner connector at both ends. Slide its built-in pins into the cross beam's <b>end holes, ${holes(info.outerColumns)}</b>, then pin it to the rail with two 1x1 connector pins: ${pinPair(info.outerCornerPins, "back")} at the back, ${pinPair(info.outerCornerPins, "front")} at the front.</li>
        <li>Lock every axle with a rubber shaft collar on its outside end.</li>
      </ol>
      <p>Plug each motor into the Brain with a <b>Smart Cable</b>: the <b>left motor into port 1</b> and the <b>right motor into port 6</b>. Put the charged battery in the Brain.</p>
      <p class="note">Why tie the pods? Without ties the outer rail is held only by the axle ends and its corners. Land on a wheel and the rail bends outward, the axles slide, and gears jump teeth. With a standoff at each corner the pod is a box: it holds its shape.</p>
      <p class="note">In VEXcode IQ, add a <b>Drivetrain</b> with those two ports and the gear ratio you built. The motors face opposite ways, so to drive forward one has to turn clockwise and the other counterclockwise. The drivetrain setup handles that for you.</p>`,
  },
  {
    title: "Your mounting zones",
    view: "zones",
    zones: true,
    text: () => `<p>The base is done. The <span class="zone-key"></span><b>green zones</b> are where mechanisms go:</p>
      <ul>
        <li>The <b>front and back cross beams</b>, outer face, both rows, <b>holes ${info.zones.cross.map(([first, last]) => `${first}-${last}`).join(", ")}</b>. Holes ${holes([...info.innerColumns, ...info.outerColumns].sort((first, second) => first - second))} already have the corners' pins in them.</li>
        <li>The <b>side walls</b>, outer face, <b>top row, holes ${info.zones.side[0]}-${info.zones.side[1]}</b>. The bottom row has the axle collars.</li>
      </ul>
      <h3 class="section">Rules for a module</h3>
      <ul class="rules">
        <li>Build the mechanism on its own beams. Pin it to a zone with <b>at least two pins in different holes</b>. One pin is a hinge, and the module would swing.</li>
        <li><b>Stay out of the side walls' bottom row</b> and the cross beam holes with corner pins in them.</li>
        <li><b>Keep the Brain's ports clear</b>: a cable has to reach every port you use.</li>
        <li>The base is about <b>${(info.size.length / 25.4).toFixed(1)} in long and ${(info.size.width / 25.4).toFixed(1)} in wide</b>. The robot must start inside the game's size limit (check this season's manual), so leave room for your module.</li>
        <li>Swapping a module means pulling only <b>its</b> pins. The base never comes apart.</li>
      </ul>`,
  },
];
if (steps.length !== data.steps.length + 1) throw new Error("the page's steps and drive-base-tied.json's steps disagree");

// ---- Scene ------------------------------------------------------------------------------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 5, 9000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a96a8, 1.9));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(220, 520, 320);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, near: 50, far: 1600 });
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xffffff, 0.7);
fill.position.set(-300, 150, -250);
scene.add(fill);

// The floor: a 6 ft square of field, with a grid line every 2 in.
const FIELD = 1828.8;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(FIELD, FIELD), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(FIELD, 36, 0x9aa8b8, 0xc4ced9);
grid.material.transparent = true; grid.material.opacity = 0.45;
grid.position.y = 0.05;
scene.add(grid);

function applyTheme() {
  const styles = getComputedStyle(document.documentElement);
  scene.background = new THREE.Color(styles.getPropertyValue("--scene").trim());
  const dark = scene.background.getHSL({}).l < 0.3;
  grid.material.color.set(dark ? 0x2c3542 : 0xc4ced9);
  floor.material.opacity = dark ? 0.35 : 0.18;
  zoneMaterial.color.set(styles.getPropertyValue("--zone").trim());
}
const zoneMaterial = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.45, depthWrite: false, side: THREE.DoubleSide });

// The robot drives as one group. Each axle is a group of its own inside it, turning with
// everything on it.
const robot = new THREE.Group();
scene.add(robot);
const wheelCenters = data.parts.filter((part) => part.id === "wheel-omni-200").map((part) => part.p);
const groundY = Math.min(...wheelCenters.map((center) => center[1])) - WHEEL_RADIUS;
const trackWidth = Math.max(...wheelCenters.map((center) => center[2])) - Math.min(...wheelCenters.map((center) => center[2]));
const chassis = new THREE.Group();
chassis.position.y = -groundY; // wheels on the floor
robot.add(chassis);
const spinGroups = data.spins.map((spin) => {
  const group = new THREE.Group();
  group.position.set(spin.x, spin.y, 0);
  chassis.add(group);
  return group;
});
// How far each axle turns for one turn of its side's wheels: the wheels' size of gear with
// them, the motor's size the other way and faster or slower by the ratio. The wheels' size sits
// half a tooth round so their teeth fall between their neighbours', not on them.
const axleTurn = (spin) => spin.motorSize ? -ratio().wheelTeeth / ratio().motorTeeth : 1;
const meshPhase = (spin) => spin.motorSize ? 0 : Math.PI / ratio().wheelTeeth;

function decode(base64, ArrayType) {
  const text = atob(base64), bytes = new Uint8Array(text.length);
  for (let index = 0; index < text.length; index++) bytes[index] = text.charCodeAt(index);
  return new ArrayType(bytes.buffer);
}
const geometryCache = new Map();
function loadGeometry(id) {
  if (!geometryCache.has(id)) {
    geometryCache.set(id, fetch(`../vex-build-center/parts/${id}.json`).then((response) => response.json()).then((mesh) => {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(decode(mesh.position, Float32Array), 3));
      if (mesh.normal) geometry.setAttribute("normal", new THREE.BufferAttribute(decode(mesh.normal, Float32Array), 3));
      geometry.setIndex(new THREE.BufferAttribute(decode(mesh.index, Uint32Array), 1));
      if (!mesh.normal) geometry.computeVertexNormals();
      return geometry;
    }));
  }
  return geometryCache.get(id);
}

// Where a part slides in from during its step: the way a builder pushes it on.
function slideFrom(part) {
  const side = Math.sign(part.p[2]) || 1, end = Math.sign(part.p[0]) || 1;
  const fromOutside = [0, 0, side * 70], fromInside = [0, 0, -side * 70];
  if (part.step === STEP.brain || part.id === "smart-motor") return [0, 90, 0];
  if (part.id === "corner-2x2" || (part.id === "beam-2x20" && Math.abs(part.p[2]) < 1)) return [end * 70, 0, 0];
  if (part.step === STEP.frame) return part.id === "beam-2x20" ? fromOutside : fromInside;
  if (part.step === STEP.gears && (part.id.startsWith("shaft") || Math.abs(part.p[2]) < 66)) return fromInside;
  return fromOutside;
}
// A gear is drawn once per ratio, in its size for that ratio; only the picked ratio's shows.
const parts = data.parts.flatMap((part) => part.versions
  ? part.versions.map((version, versionIndex) => ({ ...part, ...version, ratio: versionIndex }))
  : [{ ...part }]);
const forRatio = (part) => part.ratio === undefined || part.ratio === ratioIndex;
await Promise.all(parts.map(async (part) => {
  const color = part.gear ? GEAR_COLORS[part.gear] : COLORS[part.id] ?? "#8a94a6";
  const material = new THREE.MeshStandardMaterial({ color, metalness: 0.12, roughness: 0.55, transparent: true });
  const mesh = new THREE.Mesh(await loadGeometry(part.id), material);
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.quaternion.fromArray(part.q);
  const parent = part.spin === undefined ? chassis : spinGroups[part.spin];
  part.home = new THREE.Vector3(...part.p).sub(parent === chassis ? new THREE.Vector3() : parent.position);
  part.from = slideFrom(part);
  part.mesh = mesh;
  parent.add(mesh);
}));
document.getElementById("loading").remove();

// Mounting zones: the cross beams' outer faces (both rows, between the corner pins) and the
// side walls' outer faces (top row).
const zones = new THREE.Group();
chassis.add(zones);
{
  const { rows, faces, firstHoleX, firstCrossZ } = info;
  const ringMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide });
  const ringGeometry = new THREE.RingGeometry(2.4, 3.6, 24);
  // A green patch over the holes at `centers` (along the face) and `heights`, with a ring on each
  // hole. `place` puts a mesh on the face, lifted just off it.
  const patch = (centers, heights, place) => {
    const span = centers[centers.length - 1] - centers[0] + PITCH, height = heights.length * PITCH;
    const middle = (centers[0] + centers[centers.length - 1]) / 2, level = (Math.max(...heights) + Math.min(...heights)) / 2;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(span, height), zoneMaterial);
    place(mesh, middle, level, 0.25);
    mesh.renderOrder = 5;
    zones.add(mesh);
    for (const center of centers) for (const holeHeight of heights) {
      const ring = new THREE.Mesh(ringGeometry, ringMaterial);
      place(ring, center, holeHeight, 0.35);
      ring.renderOrder = 6;
      zones.add(ring);
    }
  };
  const holesIn = ([first, last], toPosition) => Array.from({ length: last - first + 1 }, (_, offset) => toPosition(first + offset));
  for (const run of info.zones.cross) {
    const centers = holesIn(run, (hole) => firstCrossZ + (hole - 1) * PITCH);
    for (const [faceX, facing] of [[faces.front, 1], [faces.back, -1]]) {
      patch(centers, [rows.top, rows.bottom], (mesh, along, height, lift) => {
        mesh.position.set(faceX + facing * lift, height, along);
        mesh.rotation.y = Math.PI / 2;
      });
    }
  }
  const sideCenters = holesIn(info.zones.side, (hole) => firstHoleX + (hole - 1) * PITCH);
  for (const side of [1, -1]) {
    patch(sideCenters, [rows.top], (mesh, along, height, lift) => mesh.position.set(along, height, side * (faces.side + lift)));
  }
}
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

// ---- Camera views ----------------------------------------------------------------------
const VIEWS = {
  corner: new THREE.Vector3(300, 260, 420), front: new THREE.Vector3(620, 90, 0), side: new THREE.Vector3(0, 90, 620),
  top: new THREE.Vector3(0, 640, 1), rear: new THREE.Vector3(-440, 330, 300), under: new THREE.Vector3(140, -260, 460), zones: new THREE.Vector3(-420, 330, 140),
};
const lookAt = new THREE.Vector3(0, 45, 0);
let cameraFlight = null, currentView = "corner";
function robotCenter() { return robot.position.clone().add(lookAt); }
// Back the camera off on a narrow stage (a phone, or a tall pane), so the whole base fits.
const viewDistance = () => 1.3 * Math.max(1, 1.2 / camera.aspect);
function flyTo(name) {
  currentView = name;
  const offset = VIEWS[name].clone().multiplyScalar(viewDistance()).applyAxisAngle(Y_AXIS, robot.rotation.y);
  cameraFlight = { start: camera.position.clone(), end: robotCenter().add(offset), startTarget: controls.target.clone(), elapsed: 0 };
}
const Y_AXIS = new THREE.Vector3(0, 1, 0);
controls.target.copy(robotCenter());
document.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => flyTo(button.dataset.view)));

let xrayChosen = false;
const xrayButton = document.getElementById("xray");
xrayButton.onclick = () => { xrayChosen = !xrayChosen; xrayButton.setAttribute("aria-pressed", String(xrayChosen)); };

// ---- Build mode ------------------------------------------------------------------------
let mode = "build", currentStep = 0, stepClock = 0;
const SLIDE_SECONDS = 1.1;
const ease = (time) => 1 - Math.pow(1 - Math.min(1, Math.max(0, time)), 3);
function placeParts() {
  const step = steps[currentStep];
  const xray = xrayChosen || (mode === "build" && step.xray);
  for (const part of parts) {
    const visible = (mode === "run" || part.step <= currentStep) && forRatio(part);
    part.mesh.visible = visible;
    part.mesh.position.copy(part.home);
    const material = part.mesh.material;
    material.emissive.set(0x000000);
    const ghosted = xray && part.step === STEP.outer && (part.id === "beam-2x20" || part.id === "corner-2x2");
    material.opacity = ghosted ? 0.2 : 1;
    material.depthWrite = !ghosted;
    if (mode === "build" && visible && part.step === currentStep) {
      const progress = ease(stepClock / SLIDE_SECONDS);
      part.mesh.position.add(new THREE.Vector3(...part.from).multiplyScalar(1 - progress));
      material.emissive.set(0x2b6fd6).multiplyScalar(0.25 + 0.15 * Math.sin(stepClock * 4));
    }
  }
  zones.visible = (mode === "build" && !!step.zones) || (mode === "run" && showZones);
}

// ---- Drive mode ------------------------------------------------------------------------
let leftPercent = 0, rightPercent = 0, showZones = false;
const sideTurn = { "-1": 0, "1": 0 };      // how far each side's wheels have turned (radians)
let heading = 0;

// ---- Panel -----------------------------------------------------------------------------
const content = document.getElementById("content");
const tabBuild = document.getElementById("tab-build"), tabRun = document.getElementById("tab-run");
function countRows(list) {
  const counts = new Map();
  for (const part of list) counts.set(part.id, (counts.get(part.id) || 0) + 1);
  return [...counts].map(([id, count]) => `<div><span>${PART_NAMES[id] ?? id}</span><b>&times;${count}</b></div>`).join("");
}
function renderBuild() {
  const step = steps[currentStep];
  const stepParts = parts.filter((part) => part.step === currentStep && forRatio(part));
  let list = stepParts.length ? `<div class="parts"><h3>You need</h3>${countRows(stepParts)}${currentStep === STEP.outer ? `<div><span>Smart Cable</span><b>&times;2</b></div>` : ""}</div>` : "";
  if (currentStep === steps.length - 1) list = `<div class="parts"><h3>Everything in the base</h3>${countRows(parts.filter(forRatio))}<div><span>Smart Cable</span><b>&times;2</b></div><div><span>Robot Battery</span><b>&times;1</b></div></div>`;
  content.innerHTML = `
    <div class="dots">${steps.map((_, index) => `<span class="${index <= currentStep ? "done" : ""}"></span>`).join("")}</div>
    <div class="step-count">Step ${currentStep + 1} of ${steps.length}</div>
    <h2>${step.title}</h2>
    ${step.text()}
    ${list}
    <div class="nav">
      <button id="previous" ${currentStep === 0 ? "disabled" : ""}>Back</button>
      <button id="replay">Replay</button>
      <button id="next" class="primary">${currentStep === steps.length - 1 ? "Drive it" : "Next step"}</button>
    </div>`;
  document.getElementById("previous").onclick = () => goToStep(currentStep - 1);
  document.getElementById("replay").onclick = () => { stepClock = 0; };
  document.getElementById("next").onclick = () => currentStep === steps.length - 1 ? setMode("run") : goToStep(currentStep + 1);
  wireRatioPicker(renderBuild);
}
// Picking a ratio swaps the gears in the scene and redraws the panel that holds the picker.
function wireRatioPicker(render) {
  content.querySelectorAll("[data-ratio]").forEach((button) => button.addEventListener("click", () => {
    ratioIndex = Number(button.dataset.ratio);
    const scrolled = content.scrollTop;
    render();
    content.scrollTop = scrolled;
  }));
}
function goToStep(stepIndex) {
  currentStep = Math.max(0, Math.min(steps.length - 1, stepIndex));
  stepClock = 0;
  flyTo(steps[currentStep].view);
  renderBuild();
}

const PRESETS = { Forward: [60, 60], Backward: [-60, -60], "Curve left": [30, 70], "Spin right": [50, -50], Stop: [0, 0] };
function renderRun() {
  content.innerHTML = `
    <div class="controls">
      <div class="row"><label for="left">Left motor</label><input id="left" type="range" min="-100" max="100" value="${leftPercent}"><output id="left-value">${leftPercent}%</output></div>
      <div class="row"><label for="right">Right motor</label><input id="right" type="range" min="-100" max="100" value="${rightPercent}"><output id="right-value">${rightPercent}%</output></div>
      <div class="presets">${Object.keys(PRESETS).map((name) => `<button class="chip-button" data-preset="${name}">${name}</button>`).join("")}<button class="chip-button" id="home">Back to the middle</button></div>
      <div class="toggles"><label><input type="checkbox" id="show-zones" ${showZones ? "checked" : ""}> Mounting zones</label></div>
    </div>
    ${ratioPicker()}
    <div class="readouts">
      <div class="readout"><b id="left-rpm"></b><span>left wheels (rpm)</span></div>
      <div class="readout"><b id="right-rpm"></b><span>right wheels (rpm)</span></div>
      <div class="readout"><b id="speed"></b><span>forward speed (in/s)</span></div>
      <div class="readout"><b id="turning"></b><span>turning (&deg;/s)</span></div>
    </div>
    <h2>Why five gears?</h2>
    <p>Meshing gears turn opposite ways. The motor turns its gear at hole ${info.motor}. That gear turns two: the rear wheel's at hole ${info.wheels[0]}, and the one at hole ${idlers[0]}. From there the turn goes ${idlers[0]} to ${idlers[1]} to the front wheel's at hole ${info.wheels[1]}.</p>
    <p>Count the meshes from the motor to each wheel: 1 to the rear, 3 to the front. Both odd, so both wheels turn the same way, and the robot drives instead of fighting itself. A wheel an even number of meshes away would turn backwards and fight the other one.</p>
    <h2>Why ${ratio().motorTeeth}T and ${ratio().wheelTeeth}T?</h2>
    <p>Every mesh goes from a ${gearKey("motor")}motor-size gear to a ${gearKey("wheel")}wheel-size gear. When a ${ratio().motorTeeth}T gear turns once it pushes ${ratio().motorTeeth} teeth past its neighbour, which turns the ${ratio().wheelTeeth}T gear ${ratio().turns === 1 ? "once" : ratio().turns > 1 ? `${ratio().turns} times` : "half a turn"}. ${ratio().turns === 1 ? "So the wheels turn at the motor's speed." : ratio().turns > 1 ? "The wheels turn faster than the motor, but push with half the force." : "The wheels turn slower than the motor, and push twice as hard."} Try the other ratios above and watch the readouts.</p>
    <h2>Why omni wheels?</h2>
    <p>Drive the two sides at different speeds and the robot turns. When it turns, the front and back wheels have to slide sideways a little. Plain wheels would scrub and judder. The rollers round an omni wheel let it slide sideways freely, so the robot turns smoothly, even spinning on the spot.</p>
    <h2>Tank drive</h2>
    <p>Each side has its own motor, like a tank. Same speed both sides: straight. Right side faster: it curves left. Opposite directions: it spins on the spot. Try the buttons, then the sliders.</p>`;
  const left = document.getElementById("left"), right = document.getElementById("right");
  const sync = () => {
    left.value = String(leftPercent); right.value = String(rightPercent);
    document.getElementById("left-value").textContent = `${leftPercent}%`;
    document.getElementById("right-value").textContent = `${rightPercent}%`;
  };
  left.oninput = () => { leftPercent = Number(left.value); sync(); };
  right.oninput = () => { rightPercent = Number(right.value); sync(); };
  content.querySelectorAll("[data-preset]").forEach((button) => button.addEventListener("click", () => { [leftPercent, rightPercent] = PRESETS[button.dataset.preset]; sync(); }));
  document.getElementById("home").onclick = () => { robot.position.set(0, 0, 0); heading = 0; robot.rotation.y = 0; flyTo("corner"); };
  document.getElementById("show-zones").onchange = (event) => { showZones = event.target.checked; };
  wireRatioPicker(renderRun);
}
function updateReadouts(forward, turnRate) {
  document.getElementById("left-rpm").textContent = (MOTOR_RPM * ratio().turns * leftPercent / 100).toFixed(0);
  document.getElementById("right-rpm").textContent = (MOTOR_RPM * ratio().turns * rightPercent / 100).toFixed(0);
  document.getElementById("speed").textContent = (forward / 25.4).toFixed(1);
  document.getElementById("turning").textContent = ((turnRate * 180) / Math.PI).toFixed(0);
}

function setMode(next) {
  mode = next;
  tabBuild.setAttribute("aria-selected", String(mode === "build"));
  tabRun.setAttribute("aria-selected", String(mode === "run"));
  if (mode === "build") { renderBuild(); flyTo(steps[currentStep].view); } else { currentStep = steps.length - 1; renderRun(); flyTo("corner"); }
}
tabBuild.onclick = () => setMode("build");
tabRun.onclick = () => setMode("run");

// ---- Loop ------------------------------------------------------------------------------
function resize() {
  const { clientWidth, clientHeight } = stage;
  renderer.setSize(clientWidth, clientHeight, false);
  camera.aspect = clientWidth / Math.max(1, clientHeight);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();
camera.position.copy(robotCenter()).add(VIEWS.corner.clone().multiplyScalar(viewDistance()));

const clock = new THREE.Clock();
renderBuild();
renderer.setAnimationLoop(() => {
  const seconds = Math.min(clock.getDelta(), 0.05);
  stepClock += seconds;
  let forward = 0, turnRate = 0;
  if (mode === "run") {
    // Tank drive: each side's wheels roll at their motor's speed times the gear ratio.
    const wheelSpeed = WHEEL_SPEED * ratio().turns;
    const leftSpeed = wheelSpeed * leftPercent / 100, rightSpeed = wheelSpeed * rightPercent / 100;
    forward = (leftSpeed + rightSpeed) / 2;
    turnRate = (rightSpeed - leftSpeed) / trackWidth; // right side faster: turns left
    heading += turnRate * seconds;
    robot.rotation.y = heading;
    const before = robot.position.clone();
    robot.position.add(new THREE.Vector3(Math.cos(heading), 0, -Math.sin(heading)).multiplyScalar(forward * seconds));
    const limit = FIELD / 2 - 160;
    robot.position.x = Math.max(-limit, Math.min(limit, robot.position.x));
    robot.position.z = Math.max(-limit, Math.min(limit, robot.position.z));
    // Keep the camera with the robot.
    const moved = robot.position.clone().sub(before);
    camera.position.add(moved); controls.target.add(moved);
    // Rolling forward turns a wheel about -Z (its axle, pointing right).
    sideTurn["-1"] -= (leftSpeed / WHEEL_RADIUS) * seconds;
    sideTurn["1"] -= (rightSpeed / WHEEL_RADIUS) * seconds;
    updateReadouts(forward, turnRate);
  }
  data.spins.forEach((spin, index) => { spinGroups[index].rotation.z = axleTurn(spin) * sideTurn[String(spin.side)] + meshPhase(spin); });
  placeParts();
  if (cameraFlight) {
    cameraFlight.elapsed += seconds;
    const progress = ease(cameraFlight.elapsed / 0.9);
    camera.position.lerpVectors(cameraFlight.start, cameraFlight.end, progress);
    controls.target.lerpVectors(cameraFlight.startTarget, robotCenter(), progress);
    if (progress >= 1) cameraFlight = null;
  }
  sun.position.copy(robot.position).add(new THREE.Vector3(220, 520, 320));
  sun.target.position.copy(robot.position);
  controls.update();
  floor.visible = grid.visible = camera.position.y > 0; // looking up from underneath, the floor would hide the robot
  renderer.render(scene, camera);
});
</script>
