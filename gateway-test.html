<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gateway diagnostic</title>
<style>
  body { font: 15px/1.55 system-ui, sans-serif; margin: 0; padding: 22px; color: #1f2a37; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #6b7787; margin: 0 0 18px; }
  table { border-collapse: collapse; width: 100%; max-width: 1000px; }
  th, td { border: 1px solid #dbe3ec; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #eef4f8; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  td.v { font-weight: 700; white-space: nowrap; }
  .pass { color: #17794a; } .fail { color: #b3261e; } .wait { color: #8a6d1f; }
  code { font: 12.5px ui-monospace, Consolas, monospace; color: #0a6299; }
  #summary { margin: 20px 0 0; padding: 14px 16px; border-radius: 8px; background: #f4f7f9;
             border-left: 4px solid #01aefd; max-width: 1000px; font-size: 15px; }
  iframe { display: none; }
  #code { margin: 20px 0 0; padding: 14px 18px; background: #102127; color: #7fe0a0;
          border-radius: 8px; font: 700 26px ui-monospace, Consolas, monospace;
          letter-spacing: .08em; max-width: 1000px; }
</style>
</head>
<body>
<h1>Gateway diagnostic</h1>
<p class="sub">Each row is the same request made a different way. The pattern of passes and
failures identifies which browser rule is blocking student code.</p>

<table>
  <thead><tr><th>#</th><th>What it tests</th><th>Result</th><th>Detail</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="code">RESULT &mdash; waiting…</div>
<div id="summary">Running…</div>

<script>
var GW = "https://ai.tail5091fc.ts.net";
var TESTS = [
  ["A", "Top-level page, simple GET (no preflight)", "top-simple"],
  ["B", "Top-level page, GET with Authorization (forces a preflight)", "top-preflight"],
  ["C", "Top-level page, mode:'no-cors' (bypasses CORS entirely)", "top-nocors"],
  ["D", "Sandboxed iframe, allow-scripts only - what the editor uses today", "sandbox-opaque"],
  ["E", "Sandboxed iframe, allow-scripts + allow-same-origin", "sandbox-sameorigin"],
  ["F", "Sandboxed iframe reaching a PUBLIC address (control)", "sandbox-public"],
  ["G", "Sandboxed iframe + allow=\"local-network-access\"", "frame-allow"],
  ["H", "Sandboxed iframe + allow-same-origin + allow=\"local-network-access\"", "frame-allow-same"],
  ["I", "REAL same-origin iframe (src=, not srcdoc=), no allow attribute", "frame-real"],
  ["J", "REAL same-origin iframe + allow=\"local-network-access\"", "frame-real-allow"]
];
var results = {};
var tbody = document.getElementById("rows");

TESTS.forEach(function (t) {
  var tr = document.createElement("tr");
  tr.innerHTML = '<td>' + t[0] + '</td><td>' + t[1] +
    '</td><td class="v wait" id="v-' + t[2] + '">running</td>' +
    '<td><code id="d-' + t[2] + '"></code></td>';
  tbody.appendChild(tr);
});

function record(id, ok, detail) {
  results[id] = ok;
  var v = document.getElementById("v-" + id);
  v.textContent = ok ? "reached" : "blocked";
  v.className = "v " + (ok ? "pass" : "fail");
  document.getElementById("d-" + id).textContent = detail;
  if (Object.keys(results).length === TESTS.length) explain();
}

// ---- top-level tests, run on this page's real origin ----
fetch(GW + "/healthz")
  .then(function (r) { record("top-simple", true, "HTTP " + r.status); })
  .catch(function (e) { record("top-simple", false, e.name + ": " + e.message); });

fetch(GW + "/v1/models", { headers: { "Authorization": "Bearer probe-not-real" } })
  .then(function (r) { record("top-preflight", true, "HTTP " + r.status + " (401 is expected)"); })
  .catch(function (e) { record("top-preflight", false, e.name + ": " + e.message); });

fetch(GW + "/healthz", { mode: "no-cors" })
  .then(function (r) { record("top-nocors", true, "opaque response, type=" + r.type); })
  .catch(function (e) { record("top-nocors", false, e.name + ": " + e.message); });

// ---- iframe tests ----
function frameBody(url, withAuth) {
  return '<scr'+'ipt>' +
    'fetch(' + JSON.stringify(url) + (withAuth ? ',{headers:{"Authorization":"Bearer probe-not-real"}}' : '') + ')' +
    '.then(function(r){parent.postMessage({id:ID,ok:true,d:"HTTP "+r.status},"*");})' +
    '.catch(function(e){parent.postMessage({id:ID,ok:false,d:e.name+": "+e.message},"*");});' +
    '</scr'+'ipt>';
}

function runFrame(id, sandbox, url, withAuth, allow) {
  var f = document.createElement("iframe");
  if (sandbox !== null) f.setAttribute("sandbox", sandbox);
  if (allow) f.setAttribute("allow", allow);
  f.srcdoc = "<scr"+"ipt>var ID=" + JSON.stringify(id) + ";</scr"+"ipt>" + frameBody(url, withAuth);
  document.body.appendChild(f);
  setTimeout(function () {
    if (!(id in results)) record(id, false, "no answer after 12s - treat as blocked");
  }, 12000);
}
window.addEventListener("message", function (e) {
  if (e.data && e.data.id && !(e.data.id in results)) record(e.data.id, e.data.ok, e.data.d);
});
runFrame("sandbox-opaque", "allow-scripts", GW + "/v1/models", true);
runFrame("sandbox-sameorigin", "allow-scripts allow-same-origin", GW + "/v1/models", true);
// Control: same sandbox, but a PUBLIC target. GitHub Pages sends ACAO:* so an
// opaque origin is allowed. If this passes and D fails, the sandbox is fine and
// the problem is specifically that the gateway sits on a private address.
runFrame("sandbox-public", "allow-scripts", "https://utgapps.github.io/class-codes.js", false);

// Does delegating the local-network permission into the frame unblock it?
var LNA = "local-network-access *";
runFrame("frame-allow", "allow-scripts", GW + "/v1/models", true, LNA);
runFrame("frame-allow-same", "allow-scripts allow-same-origin", GW + "/v1/models", true, LNA);

// And is a srcdoc document treated differently from an ordinary one?
function runRealFrame(id, allow) {
  var f = document.createElement("iframe");
  if (allow) f.setAttribute("allow", allow);
  f.src = "/gateway-frame.html?id=" + encodeURIComponent(id);
  document.body.appendChild(f);
  setTimeout(function () {
    if (!(id in results)) record(id, false, "no answer after 12s - treat as blocked");
  }, 12000);
}
runRealFrame("frame-real", null);
runRealFrame("frame-real-allow", LNA);

// ---- read the pattern ----
function explain() {
  var s = document.getElementById("summary");
  var G = results["frame-allow"], H = results["frame-allow-same"];
  var I = results["frame-real"], J = results["frame-real-allow"];
  var msg;
  if (G) {
    msg = "FIX FOUND: adding allow=\"local-network-access\" to the preview iframe unblocks it. " +
          "That is a one-attribute change in the editor and the shared-page renderer, with no " +
          "loss of sandboxing and no fleet policy needed.";
  } else if (H && !G) {
    msg = "PARTIAL: the frame needs BOTH the permission delegated AND a real origin. That means " +
          "giving up allow-scripts-only isolation, so the preview must move to a separate origin " +
          "rather than simply gaining allow-same-origin on this one.";
  } else if (I || J) {
    msg = "DIAGNOSIS: an ordinary iframe reaches the gateway but a srcdoc one does not. srcdoc " +
          "documents are being treated as a different address space. FIX: serve the preview from " +
          "a real URL instead of srcdoc.";
  } else {
    msg = "None of the frame variants worked. The block applies to every iframe regardless of " +
          "origin, permission or srcdoc. That leaves a Chrome policy on the fleet, or moving the " +
          "gateway to a public address via a tunnel. Send the whole table.";
  }
  s.textContent = msg;
  var order = ["top-simple","top-preflight","top-nocors","sandbox-opaque",
               "sandbox-sameorigin","sandbox-public","frame-allow","frame-allow-same",
               "frame-real","frame-real-allow"];
  var letters = "ABCDEFGHIJ";
  var line = order.map(function (k, i) {
    return letters[i] + (results[k] ? "1" : "0");
  }).join(" ");
  document.getElementById("code").textContent = "RESULT  " + line;
}
</script>
</body>
</html>
