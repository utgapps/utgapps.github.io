<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Animator · UTG Academy</title>
  <script>window.UTG_GUARD="../";window.UTG_TOOL="animator";document.write('<script src="../class-codes.js?t=' + Date.now() + '"><\/script>');</script>
  <script src="../guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ===================== TOP BAR ===================== -->
    <header class="topbar">
      <div class="brand">
        <img class="logo-img" src="https://s3.us-west-1.amazonaws.com/utg.pictures.videos/UTGWeb/utglogoh.svg" alt="UTG Academy" />
        <span class="brand-sep"></span>
        <span class="brand-name">Animator</span>
      </div>

      <div class="tools">
        <button id="undoBtn" class="tbtn" title="Undo">↶ Undo</button>

        <span class="divider"></span>

        <button id="onionBtn" class="tbtn" title="Show the frame before this one, faintly">👻 Ghost last frame</button>

        <span class="divider"></span>

        <span class="tlabel">Speed</span>
        <div class="stepper">
          <button id="fpsDown" class="step" title="Slower">−</button>
          <span id="fpsVal" class="stepval">8</span>
          <button id="fpsUp" class="step" title="Faster">＋</button>
        </div>
        <button id="loopBtn" class="tbtn on" title="Play over and over">🔁 Loop</button>

        <span class="divider"></span>

        <button id="playBtn" class="tbtn primary" title="Play the animation">▶ Play</button>
        <button id="gifBtn" class="tbtn" title="Save your animation as a GIF you can share">🎞️ Save GIF</button>

        <span class="divider"></span>

        <button id="newBtn" class="tbtn" title="Start over">✨ New</button>
      </div>
    </header>

    <!-- ===================== SCENE BAR ===================== -->
    <div class="scenebar">
      <button id="addActorBtn" class="tbtn">🧍 Add Figure</button>
      <button id="makeFigBtn" class="tbtn">🧑‍🎨 Make Figure</button>
      <button id="addPropBtn" class="tbtn">🖼️ Add Object</button>

      <span class="divider"></span>

      <span class="tlabel">Background</span>
      <button id="bgPhotoBtn" class="tbtn">🏞️ Photo</button>
      <button id="bgClearBtn" class="tbtn">Blank</button>

      <span class="divider"></span>

      <span class="tlabel">Figure color</span>
      <div class="swatches" id="swatches"></div>

      <span class="divider"></span>

      <span id="selInfo" class="selinfo">Nothing selected</span>
      <button id="removeSelBtn" class="tbtn danger" disabled>🗑 Remove</button>

      <input type="file" id="propFile" accept="image/*" hidden />
      <input type="file" id="bgFile" accept="image/*" hidden />
    </div>

    <!-- ===================== STAGE ===================== -->
    <main class="stage-area">
      <div class="stage-wrap">
        <canvas id="stage" width="1280" height="720"></canvas>
      </div>
      <div class="hint" id="hint">Drag the <b>blue dots</b> to bend arms and legs, or the <b>gold dot</b> to move a figure. Add more figures, a background, or your own objects. Then press <b>＋ Add Frame</b> and move things a little!</div>
    </main>

    <!-- ===================== FRAME STRIP ===================== -->
    <footer class="frames">
      <div class="frame-actions">
        <button id="addFrame" class="fbtn add" title="Copy this frame so you can move things a little">＋ Add Frame</button>
        <button id="delFrame" class="fbtn del" title="Delete this frame">🗑</button>
      </div>
      <div class="frame-strip" id="strip"></div>
    </footer>

  </div>

  <!-- ===================== FIGURE MAKER ===================== -->
  <div id="figMaker" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">🧑‍🎨 Make a Figure</span>
        <span class="modal-hint" id="figHint">Drag the dots to shape your figure.</span>
      </div>
      <div class="fig-tools">
        <button class="ftool on" data-mode="move">✋ Move</button>
        <button class="ftool" data-mode="add">➕ Add Limb</button>
        <button class="ftool" data-mode="head">⭕ Head</button>
        <button class="ftool" data-mode="erase">❌ Erase</button>
        <span class="divider"></span>
        <button id="figUndo" class="ftool">↶ Undo</button>
        <button id="figReset" class="ftool">🧍 Person</button>
        <button id="figBlank" class="ftool">◦ Blank</button>
      </div>
      <div class="fig-stage"><canvas id="figCanvas" width="760" height="480"></canvas></div>
      <div class="modal-foot">
        <button id="figCancel" class="tbtn">Cancel</button>
        <button id="figAdd" class="tbtn primary">Add to Scene ✓</button>
      </div>
    </div>
  </div>

  <script src="gifenc.js"></script>
  <script src="app.js"></script>
  <script src="figuremaker.js"></script>
</body>
</html>
