<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Animator · UTG Academy</title>
  <script>window.UTG_GUARD="../";window.UTG_TOOL="animator";document.write('<script src="../class-codes.js?t=' + Date.now() + '"><\/script>');</script>
  <script src="../guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ===================== TOP BAR ===================== -->
    <header class="topbar">
      <div class="brand">
        <img class="logo-img" src="https://s3.us-west-1.amazonaws.com/utg.pictures.videos/UTGWeb/utglogoh.svg" alt="UTG Academy" />
        <span class="brand-sep"></span>
        <span class="brand-name">Animator</span>
      </div>

      <div class="tools">
        <button id="undoBtn" class="tbtn" title="Undo">↶ Undo</button>

        <span class="divider"></span>

        <button id="onionBtn" class="tbtn" title="See the frame before this one, faintly">👻 Onion</button>

        <span class="divider"></span>

        <span class="tlabel">Person color</span>
        <div class="swatches" id="swatches"></div>

        <span class="divider"></span>

        <span class="tlabel">Speed</span>
        <div class="stepper">
          <button id="fpsDown" class="step" title="Slower">−</button>
          <span id="fpsVal" class="stepval">8</span>
          <button id="fpsUp" class="step" title="Faster">＋</button>
        </div>
        <button id="loopBtn" class="tbtn on" title="Play over and over">🔁 Loop</button>

        <span class="divider"></span>

        <button id="playBtn" class="tbtn primary" title="Play the animation">▶ Play</button>

        <span class="divider"></span>

        <button id="newBtn" class="tbtn" title="Start over">✨ New</button>
      </div>
    </header>

    <!-- ===================== SCENE BAR ===================== -->
    <div class="scenebar">
      <button id="addActorBtn" class="tbtn">🧍 Add Person</button>
      <button id="addPropBtn" class="tbtn">🖼️ Add Image</button>

      <span class="divider"></span>

      <span class="tlabel">Background</span>
      <input type="color" id="bgColor" class="colorpick" value="#ffffff" title="Background color" />
      <button id="bgPhotoBtn" class="tbtn">Photo</button>
      <button id="bgClearBtn" class="tbtn">Clear</button>

      <span class="divider"></span>

      <span id="selInfo" class="selinfo">Nothing selected</span>
      <button id="removeSelBtn" class="tbtn danger" disabled>🗑 Remove</button>

      <input type="file" id="propFile" accept="image/*" hidden />
      <input type="file" id="bgFile" accept="image/*" hidden />
    </div>

    <!-- ===================== STAGE ===================== -->
    <main class="stage-area">
      <div class="stage-wrap">
        <canvas id="stage" width="800" height="600"></canvas>
      </div>
      <div class="hint" id="hint">Drag the <b>blue dots</b> to bend arms and legs, or the <b>gold dot</b> to move a person. Add more people, a background, or your own pictures. Then press <b>＋ Add Frame</b> and move things a little!</div>
    </main>

    <!-- ===================== FRAME STRIP ===================== -->
    <footer class="frames">
      <div class="frame-actions">
        <button id="addFrame" class="fbtn add" title="Copy this frame so you can move the person a little">＋ Add Frame</button>
        <button id="delFrame" class="fbtn del" title="Delete this frame">🗑</button>
      </div>
      <div class="frame-strip" id="strip"></div>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
