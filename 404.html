<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Shared student work. Never index it: the whole point of the random suffix
     is that these pages are found by being given the link, not by searching. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>UTG Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --brand:#01aefd; --ink:#1f2a37; --muted:#6b7787; --bg:#eef2f7; --border:#dbe3ec; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:16px/1.6 Rubik,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:#fff; border-bottom:1px solid var(--border); }
  header img { height:24px; }
  header .slash { color:#b8c8ce; }
  header h1 { font-size:15px; margin:0; font-weight:700; }
  header .by { margin-left:auto; color:var(--muted); font-size:12px; }
  #stage { flex:1; min-height:0; }
  #stage iframe { width:100%; height:100%; border:0; background:#fff; display:block; }
  .msg { max-width:520px; margin:14vh auto; padding:0 22px; text-align:center; }
  .msg h2 { font-size:24px; margin:0 0 10px; }
  .msg p { color:var(--muted); margin:0 0 8px; }
  .msg a { color:var(--brand); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<header>
  <a href="/"><img src="https://s3.us-west-1.amazonaws.com/utg.pictures.videos/UTGWeb/utglogoh.svg" alt="UTG Academy"></a>
  <span class="slash">/</span>
  <h1 id="title">Loading…</h1>
  <span class="by">Made by a UTG Academy student</span>
</header>
<div id="stage"><div class="msg"><h2>Loading…</h2></div></div>

<script>
/* Runs INSIDE the shared project's frame, ahead of the student's own code. It
   is written here as a real function and handed over as its source text.

   The frame is a srcdoc document, and a srcdoc document takes its base URL
   from this page - so href="about.html" meant utgapps.github.io/<slug>/about.html
   and a click loaded this whole share page again, header and all, inside the
   frame. Every link is settled here instead, after the student's own click
   handlers, so a preventDefault in them still wins. The same rules as the
   editor's preview (classroom-app/src/lib/preview.ts) - change one, change the
   other. */
function sharedLinks(page, hash, names) {
  function post(kind, text) { parent.postMessage({ __utgShared: true, kind: kind, text: text }, "*"); }
  var outside = /^([a-z][a-z0-9+.-]*:|\/\/)/i;
  function resolve(reference) {
    var raw = reference.split("#")[0].split("?")[0].replace(/\\/g, "/");
    var out = raw.charAt(0) === "/" ? [] : page.split("/").slice(0, -1);
    var parts = raw.split("/");
    for (var index = 0; index < parts.length; index++) {
      if (!parts[index] || parts[index] === ".") continue;
      if (parts[index] === "..") { out.pop(); continue; }
      out.push(parts[index]);
    }
    return out.join("/") || page;
  }
  function scrollToHash(target) {
    var id = target.slice(1);
    try { id = decodeURIComponent(id); } catch (error) {}
    if (!id || id.toLowerCase() === "top") { window.scrollTo(0, 0); return; }
    var element = document.getElementById(id) || document.getElementsByName(id)[0];
    // scrollIntoView would scroll this share page too; only the project scrolls.
    if (element) window.scrollTo(0, element.getBoundingClientRect().top + window.pageYOffset);
  }
  function openPage(reference, what) {
    var name = resolve(reference);
    var cut = reference.indexOf("#");
    if (names.indexOf(name) === -1) console.error(page + " " + what + ' "' + reference + '", but this project has no file at that path.');
    else if (!/\.html?$/i.test(name)) console.error(page + " " + what + ' "' + reference + '", which is not a page.');
    else post("navigate", name + (cut === -1 ? "" : reference.slice(cut)));
  }
  window.addEventListener("click", function (event) {
    if (event.defaultPrevented || event.button !== 0) return;
    var link = event.target && event.target.closest ? event.target.closest("a[href], area[href]") : null;
    if (!link) return;
    var href = (link.getAttribute("href") || "").trim();
    if (/^javascript:/i.test(href)) return;
    event.preventDefault();
    if (href.charAt(0) === "#") scrollToHash(href);
    else if (outside.test(href)) post("open", href);
    else openPage(href, "links to");
  });
  // A form nobody stopped loads its page again, or its action, as on the web.
  window.addEventListener("submit", function (event) {
    if (event.defaultPrevented) return;
    var action = ((event.target && event.target.getAttribute && event.target.getAttribute("action")) || "").trim();
    if (outside.test(action)) return;
    event.preventDefault();
    openPage(action || page, "sends its form to");
  });
  // On Back, the browser would put the frame's scroll back where it was, over the #fragment.
  try { history.scrollRestoration = "manual"; } catch (error) {}
  window.addEventListener("load", function () { if (hash) scrollToHash(hash); });
}

(function () {
  var API = "https://utg-classroom-api.utgapps.workers.dev";
  var stage = document.getElementById("stage");

  function show(heading, detail) {
    document.getElementById("title").textContent = "UTG Academy";
    document.title = heading + " · UTG Academy";
    stage.innerHTML = "";
    var box = document.createElement("div");
    box.className = "msg";
    var h = document.createElement("h2"); h.textContent = heading; box.appendChild(h);
    var p = document.createElement("p"); p.textContent = detail; box.appendChild(p);
    var a = document.createElement("a"); a.href = "/"; a.textContent = "Go to UTG Academy →"; box.appendChild(a);
    stage.appendChild(box);
  }

  // GitHub Pages serves this file for any path that is not a real file, which
  // is what lets a share link look like a normal folder. The first path
  // segment is the slug; there is no username in it by design. Whatever
  // follows it is the page of the project: /<slug>/about.html.
  var segments = location.pathname.split("/").filter(Boolean);
  var slug = segments[0] || "";
  if (!/^[A-Za-z0-9-]{3,64}$/.test(slug)) {
    show("Page not found", "There is nothing at this address.");
    return;
  }
  function pageFromAddress() {
    var rest = segments.slice(1);
    try { rest = rest.map(decodeURIComponent); } catch (error) {}
    return rest.join("/") || "index.html";
  }

  var data = null;
  var frame = null;
  var current = "";

  // Script text safe to put inside a <script> element.
  function scriptJson(value) { return JSON.stringify(value).replace(/</g, "\\u003c"); }

  function render(page, hash) {
    // A share page cached from before the worker sent every page has only html.
    var pages = data.pages || { "index.html": data.html };
    if (!Object.prototype.hasOwnProperty.call(pages, page)) {
      frame = null;
      show("Page not found", "This project has no page called " + page + ".");
      return;
    }
    current = page + hash;
    var links = "<script>(" + sharedLinks.toString() + ")(" + scriptJson(page) + "," + scriptJson(hash) + "," +
      scriptJson(data.files || Object.keys(pages)) + ");<\/script>";
    // Sandboxed with no allow-same-origin: one student's shared code must not
    // be able to read another visitor's storage on this domain. The worker has
    // already stripped API keys and assembled the page.
    // allow-forms is required, not optional: the AI101 chat box is a <form>,
    // and without this token Chrome suppresses its submit event, so the whole
    // project looks alive but Send does nothing. Must match PREVIEW_SANDBOX in
    // classroom-app/src/lib/preview.ts.
    // A new frame for every page, filled before it is attached: giving the old
    // one a new srcdoc adds a history entry of its own, and Back would step
    // inside the frame instead of returning to the page before.
    frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-scripts allow-forms");
    // Same reason as the editor preview: an opaque origin cannot inherit the
    // permission to reach the gateway's private address, so hand it over.
    frame.setAttribute("allow", "local-network-access *");
    frame.setAttribute("title", data.title || "Shared project");
    frame.srcdoc = links + pages[page];
    stage.innerHTML = "";
    stage.appendChild(frame);
  }

  /* A page of the project asked for another one. It gets its own address, so
     the browser's Back button walks the pages and a link to one page can be
     passed on. Only a page the project really has is followed. */
  window.addEventListener("message", function (event) {
    if (!frame || event.source !== frame.contentWindow) return;
    var message = event.data;
    if (!message || message.__utgShared !== true || typeof message.text !== "string") return;
    if (message.kind === "open") {
      // The sandbox has no allow-popups, so a link off the project opens from here.
      if (/^(https?:|mailto:)/i.test(message.text)) window.open(message.text, "_blank", "noopener");
      return;
    }
    if (message.kind !== "navigate" || !data.pages) return;
    var cut = message.text.indexOf("#");
    var page = cut === -1 ? message.text : message.text.slice(0, cut);
    var hash = cut === -1 ? "" : message.text.slice(cut);
    if (!Object.prototype.hasOwnProperty.call(data.pages, page)) return;
    var address = "/" + slug + "/" + page.split("/").map(encodeURIComponent).join("/") + hash;
    // A form sent back to its own page is a reload, not somewhere to come back from.
    if (page + hash === current) history.replaceState(null, "", address);
    else history.pushState(null, "", address);
    segments = location.pathname.split("/").filter(Boolean);
    render(page, hash);
  });
  window.addEventListener("popstate", function () {
    segments = location.pathname.split("/").filter(Boolean);
    if (data) render(pageFromAddress(), location.hash);
  });

  fetch(API + "/shared/" + encodeURIComponent(slug), { cache: "no-store" })
    .then(function (res) {
      if (res.status === 404) throw new Error("gone");
      if (!res.ok) throw new Error("bad");
      return res.json();
    })
    .then(function (result) {
      data = result;
      document.getElementById("title").textContent = data.title || "Shared project";
      document.title = (data.title || "Shared project") + " · UTG Academy";
      render(pageFromAddress(), location.hash);
    })
    .catch(function (err) {
      if (err && err.message === "gone") show("This link is switched off", "The student who made this project turned the link off, or the project was deleted.");
      else show("Page not found", "There is nothing at this address.");
    });
})();
</script>
</body>
</html>
